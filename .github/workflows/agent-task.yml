name: Agent Task

on:
  repository_dispatch:
    types: [agent-task]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  TASK_ID: ${{ github.event.client_payload.taskId }}
  TASK_FINGERPRINT: ${{ github.event.client_payload.taskFingerprint }}
  ISSUE_KEY: ${{ github.event.client_payload.issueKey }}
  SUMMARY: ${{ github.event.client_payload.summary }}
  DESCRIPTION: ${{ github.event.client_payload.description }}
  BRANCH_NAME: ${{ github.event.client_payload.branchName }}

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config user.name "jira-agent[bot]"
          git config user.email "jira-agent[bot]@users.noreply.github.com"

      - name: Create branch
        run: |
          git checkout -b "${{ env.BRANCH_NAME }}"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        id: claude
        run: |
          claude -p \
            "You are an automation agent working on the react-automated repository.
            A Jira ticket has been assigned to you. Implement the requested changes.

            ## Jira Issue
            - Key: ${{ env.ISSUE_KEY }}
            - Summary: ${{ env.SUMMARY }}
            - Description: ${{ env.DESCRIPTION }}

            ## Instructions
            1. Read the issue summary and description carefully.
            2. Understand what code changes are needed in this React TypeScript project.
            3. Implement the changes with clean, well-structured code.
            4. Make sure the code compiles (run npx tsc --noEmit to check).
            5. If tests exist, make sure they pass.
            6. Keep changes minimal and focused on the ticket.
            7. Do NOT modify files in the automation/ or .github/ directories.

            ## Code Style
            - Be concise. Write the minimum code needed to solve the ticket — no more.
            - Do NOT add unnecessary comments. Only comment non-obvious logic or workarounds.
            - Do NOT overengineer. No extra abstractions, wrapper functions, or utility layers unless explicitly requested.
            - Prefer simple, direct solutions over clever or generic ones.
            - Do NOT add unrelated improvements, refactors, or 'nice-to-haves' beyond the ticket scope.

            ## Important
            - This is a Vite + React + TypeScript project.
            - Only change files relevant to the ticket.
            - Do NOT run git add, git commit, or git push. Just make the file changes — the CI pipeline handles committing and pushing.
            - If the task is unclear, implement the most reasonable interpretation and note assumptions." \
            --allowedTools "Bash(npm run *)" "Bash(npx *)" "Bash(node *)" "Bash(cat *)" "Bash(ls *)" "Read" "Write" "Edit" "Glob" "Grep" \
            --dangerously-skip-permissions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: global.anthropic.claude-sonnet-4-20250514-v1:0
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Check for changes
        id: changes
        run: |
          # Check for uncommitted changes (files Claude edited but didn't commit)
          DIRTY="$(git status --porcelain)"
          # Check for commits Claude may have made on this branch
          COMMITS_AHEAD="$(git rev-list --count HEAD ^origin/main 2>/dev/null || echo 0)"

          if [ -n "$DIRTY" ] || [ "$COMMITS_AHEAD" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found changes: dirty='${DIRTY:-(clean)}', commits_ahead=${COMMITS_AHEAD}"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Stage and commit any uncommitted changes
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(${{ env.ISSUE_KEY }}): ${{ env.SUMMARY }}

          Automated implementation by Jira agent.
          Task ID: ${{ env.TASK_ID }}
          " || true
          fi
          git push origin "${{ env.BRANCH_NAME }}"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${{ env.ISSUE_KEY }}] ${{ env.SUMMARY }}`,
              head: '${{ env.BRANCH_NAME }}',
              base: 'main',
              body: [
                `## Jira Issue`,
                `**Key:** ${{ env.ISSUE_KEY }}`,
                `**Summary:** ${{ env.SUMMARY }}`,
                ``,
                `## Description`,
                `${{ env.DESCRIPTION }}`,
                ``,
                `---`,
                `🤖 *Automated by Jira Agent (Task: ${{ env.TASK_ID }})*`,
              ].join('\n'),
            });
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('pr_number', pr.number);

            // Add label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['agent-task'],
            });

      - name: Transition Jira to CODE REVIEW
        if: steps.pr.outputs.pr_url
        run: |
          # Get available transitions
          TRANSITIONS=$(curl -s -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${{ env.ISSUE_KEY }}/transitions")

          # Find CODE REVIEW transition ID
          TRANSITION_ID=$(echo "$TRANSITIONS" | jq -r '.transitions[] | select(.to.name | ascii_upcase == "CODE REVIEW") | .id' | head -1)

          if [ -n "$TRANSITION_ID" ] && [ "$TRANSITION_ID" != "null" ]; then
            curl -s -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${{ env.ISSUE_KEY }}/transitions" \
              -d "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}"
            echo "Transitioned to CODE REVIEW"
          else
            echo "CODE REVIEW transition not found"
          fi

      - name: Post Jira Comment
        if: always()
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          BRANCH="${{ env.BRANCH_NAME }}"
          HAS_CHANGES="${{ steps.changes.outputs.has_changes }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$HAS_CHANGES" == "true" ] && [ -n "$PR_URL" ]; then
            # Success with PR — use ADF with clickable link
            BODY=$(cat <<EOF
          {"type":"doc","version":1,"content":[
            {"type":"paragraph","content":[
              {"type":"text","text":"Agent completed implementation.","marks":[{"type":"strong"}]}
            ]},
            {"type":"bulletList","content":[
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Branch: "},{"type":"text","text":"${BRANCH}","marks":[{"type":"code"}]}
              ]}]},
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Pull Request: "},
                {"type":"inlineCard","attrs":{"url":"${PR_URL}"}}
              ]}]},
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Actions Run: "},
                {"type":"inlineCard","attrs":{"url":"${RUN_URL}"}}
              ]}]}
            ]},
            {"type":"paragraph","content":[
              {"type":"text","text":"Status: Ready for code review"}
            ]}
          ]}
          EOF
          )
          elif [ "$HAS_CHANGES" == "false" ]; then
            BODY=$(cat <<EOF
          {"type":"doc","version":1,"content":[
            {"type":"paragraph","content":[
              {"type":"text","text":"Agent reviewed the ticket but found no code changes needed. Please review the issue description and clarify what needs to be done."}
            ]},
            {"type":"bulletList","content":[
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Actions Run: "},
                {"type":"inlineCard","attrs":{"url":"${RUN_URL}"}}
              ]}]}
            ]}
          ]}
          EOF
          )
          else
            BODY=$(cat <<EOF
          {"type":"doc","version":1,"content":[
            {"type":"paragraph","content":[
              {"type":"text","text":"Agent encountered an issue during implementation.","marks":[{"type":"strong"}]}
            ]},
            {"type":"bulletList","content":[
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Branch: "},{"type":"text","text":"${BRANCH}","marks":[{"type":"code"}]}
              ]}]},
              {"type":"listItem","content":[{"type":"paragraph","content":[
                {"type":"text","text":"Actions Run: "},
                {"type":"inlineCard","attrs":{"url":"${RUN_URL}"}}
              ]}]}
            ]},
            {"type":"paragraph","content":[
              {"type":"text","text":"Check the Actions logs for details. You may need to retry by moving the ticket back to TODO then TRIGGER AGENT."}
            ]}
          ]}
          EOF
          )
          fi

          # Remove newlines/extra spaces from BODY for valid JSON
          BODY_CLEAN=$(echo "$BODY" | tr -d '\n' | sed 's/  */ /g')

          curl -s -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/${{ env.ISSUE_KEY }}/comment" \
            -d "{\"body\":${BODY_CLEAN}}"

      - name: Slack Notification
        if: always()
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          HAS_CHANGES="${{ steps.changes.outputs.has_changes }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$HAS_CHANGES" == "true" ] && [ -n "$PR_URL" ]; then
            PAYLOAD=$(cat <<EOF
          {
            "blocks": [
              {"type":"section","text":{"type":"mrkdwn","text":"*Agent Task Complete* — \`${{ env.ISSUE_KEY }}\`\n*Summary:* ${{ env.SUMMARY }}"}},
              {"type":"section","text":{"type":"mrkdwn","text":"*Status:* PR created — ready for review\n*PR:* <${PR_URL}|View Pull Request>\n*Branch:* \`${{ env.BRANCH_NAME }}\`"}},
              {"type":"context","elements":[{"type":"mrkdwn","text":"<${RUN_URL}|View Actions Run>"}]}
            ]
          }
          EOF
          )
          elif [ "$HAS_CHANGES" == "false" ]; then
            PAYLOAD=$(cat <<EOF
          {
            "blocks": [
              {"type":"section","text":{"type":"mrkdwn","text":"*Agent Task Complete* — \`${{ env.ISSUE_KEY }}\`\n*Summary:* ${{ env.SUMMARY }}"}},
              {"type":"section","text":{"type":"mrkdwn","text":"*Status:* No changes needed — review the ticket description"}},
              {"type":"context","elements":[{"type":"mrkdwn","text":"<${RUN_URL}|View Actions Run>"}]}
            ]
          }
          EOF
          )
          else
            PAYLOAD=$(cat <<EOF
          {
            "blocks": [
              {"type":"section","text":{"type":"mrkdwn","text":"*Agent Task Failed* — \`${{ env.ISSUE_KEY }}\`\n*Summary:* ${{ env.SUMMARY }}"}},
              {"type":"section","text":{"type":"mrkdwn","text":"*Status:* Failed — check logs\n*Branch:* \`${{ env.BRANCH_NAME }}\`"}},
              {"type":"context","elements":[{"type":"mrkdwn","text":"<${RUN_URL}|View Actions Run>"}]}
            ]
          }
          EOF
          )
          fi

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(echo "$PAYLOAD" | tr -d '\n' | sed 's/  */ /g')"

      - name: Update DynamoDB Task Status
        if: always()
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          HAS_CHANGES="${{ steps.changes.outputs.has_changes }}"

          if [ "$HAS_CHANGES" == "true" ] && [ -n "$PR_URL" ]; then
            STATUS="pr_created"
          elif [ "$HAS_CHANGES" == "false" ]; then
            STATUS="completed_no_changes"
          else
            STATUS="failed"
          fi

          aws dynamodb update-item \
            --table-name "${{ secrets.DYNAMODB_TABLE }}" \
            --key "{\"taskFingerprint\":{\"S\":\"jira:${{ env.ISSUE_KEY }}\"},\"taskId\":{\"S\":\"${{ env.TASK_ID }}\"}}" \
            --update-expression "SET #s = :status, updatedAt = :now, prUrl = :pr" \
            --expression-attribute-names '{"#s":"status"}' \
            --expression-attribute-values "{\":status\":{\"S\":\"${STATUS}\"},\":now\":{\"S\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},\":pr\":{\"S\":\"${PR_URL:-none}\"}}" \
            --region "${{ secrets.AWS_REGION }}" \
            2>/dev/null || echo "DynamoDB update skipped (no AWS creds in this context)"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
